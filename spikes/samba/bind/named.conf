// S0 spike: fabric's own zone as usual, the AD zone from Samba's database through DLZ.
options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion no;
    // Windows and Samba sign their updates with Kerberos (GSS-TSIG): the DC's DNS service key
    tkey-gssapi-keytab "/data/bind-dns/dns.keytab";
    minimal-responses yes;
};
zone "lan.test" {
    type primary;
    file "/etc/bind/db.lan.test";
};
dlz "AD DNS Zone" {
    database "dlopen @LIB@/samba/bind9/dlz_bind9_18.so --url=/data/bind-dns/dns/sam.ldb";
};
