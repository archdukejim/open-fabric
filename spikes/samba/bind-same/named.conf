// S0 spike Q14: same-domain mode. AD's zone IS fabric's zone (lan.test) and BIND serves it only through DLZ;
// ACME DNS-01 names are CNAMEd into a small zone of BIND's own that accepts TSIG-signed updates.
options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion no;
    tkey-gssapi-keytab "/data/bind-dns/dns.keytab";
    minimal-responses yes;
};
include "/run/secrets/acme.key";
zone "acme.lan.test" {
    type primary;
    file "/var/cache/bind/db.acme";
    update-policy { grant acme subdomain acme.lan.test. TXT; };
};
dlz "AD DNS Zone" {
    database "dlopen @LIB@/samba/bind9/dlz_bind9_18.so --url=/data/bind-dns/dns/sam.ldb";
};
