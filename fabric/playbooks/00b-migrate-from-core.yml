---
# Section 0b — Migrate a pre-fabric (core-template) install in place
#
# Runs only when <deploy_base_dir>/core exists and <deploy_base_dir>/fabric
# does not; a no-op on fresh or already-migrated hosts. Must run before
# section 01, which reads secrets and vars from <deploy_base_dir>/fabric.
#
#   /opt/core                      -> /opt/fabric
#   config/core-secrets.yml        -> config/fabric-secrets.yml
#   vars key core_subnet           -> fabric_subnet
#   docker network core_net        -> fabric_net (recreated by section 07,
#                                     same subnet; containers are recreated
#                                     on start by the systemd wrappers)
#   /usr/local/bin/core-mgr        -> fabricctl (+ core-mgr alias, section 04)
#   resolved.conf.d/core-dns.conf  -> fabric-dns.conf (section 05)
#
# Service data dirs (/opt/nginx, /opt/bind9, /opt/stepca, ...) are untouched.
- name: Section 0b - Migrate core-template install to fabric
  hosts: "{{ target_host }}"
  become: true
  gather_facts: false
  vars:
    base: "{{ deploy_base_dir | default('/opt') }}"

  tasks:
    - name: Check for a pre-fabric install
      ansible.builtin.stat:
        path: "{{ base }}/core"
      register: old_core

    - name: Check for an existing fabric install
      ansible.builtin.stat:
        path: "{{ base }}/fabric"
      register: new_fabric

    - name: Migrate core-template -> fabric
      when: old_core.stat.isdir | default(false) and not new_fabric.stat.exists
      tags: [always]
      block:
        - name: Stop services (the Docker network is replaced)
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: stopped
          loop: [webui, nginx, keycloak, postgres, ldap, stepca, bind9]
          failed_when: false

        - name: Move {{ base }}/core to {{ base }}/fabric
          ansible.builtin.command:
            cmd: "mv {{ base }}/core {{ base }}/fabric"
            creates: "{{ base }}/fabric"

        - name: Rename secrets file
          ansible.builtin.command:
            cmd: "mv {{ base }}/fabric/config/core-secrets.yml {{ base }}/fabric/config/fabric-secrets.yml"
            removes: "{{ base }}/fabric/config/core-secrets.yml"
            creates: "{{ base }}/fabric/config/fabric-secrets.yml"

        - name: Rename core_subnet to fabric_subnet in vars
          ansible.builtin.replace:
            path: "{{ base }}/fabric/config/vars.yaml"
            regexp: '^core_subnet:'
            replace: 'fabric_subnet:'

        - name: Remove old core_net Docker network (fabric_net is created in section 07)
          ansible.builtin.shell:
            cmd: |
              for c in $(docker network inspect core_net -f '{{ '{{' }}range .Containers{{ '}}' }}{{ '{{' }}.Name{{ '}}' }} {{ '{{' }}end{{ '}}' }}' 2>/dev/null); do
                docker network disconnect -f core_net "$c" || true
              done
              docker network rm core_net
          register: rm_core_net
          changed_when: rm_core_net.rc == 0
          failed_when: false

        - name: Remove old CLI and resolver drop-in (recreated under new names)
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /usr/local/bin/core-mgr
            - /etc/systemd/resolved.conf.d/core-dns.conf

        - name: Record migration
          ansible.builtin.lineinfile:
            path: "{{ base }}/fabric/archive/audit.log"
            line: "[migration] core-template -> fabric on {{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
            create: true
            mode: '0600'
